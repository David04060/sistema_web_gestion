# Producción autorizada. Las credenciales se introducen en Render, nunca aquí.
services:
  - type: web
    name: sistema-documental
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DB_PROFILE
        value: neon
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEON_BRANCH_ID
        sync: false
      - key: NEON_HOST
        sync: false
      - key: NEON_DATABASE
        value: sistema_web_documental_final
      - key: R2_PDF_PREFIX
        value: produccion/
      - key: CORS_ORIGINS
        sync: false
